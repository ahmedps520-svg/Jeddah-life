<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1b2b" />
    <title>Offline · JEDDAH LIFE</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f9f5ee; color: #0b1b2b;
        font-family: system-ui, -apple-system, "Segoe UI", "IBM Plex Sans Arabic", sans-serif; }
      main { max-width: 440px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 26px; margin: 20px 0 8px; }
      p { margin: 0 0 8px; color: #4a5a6a; line-height: 1.55; }
      .ar { direction: rtl; margin-top: 28px; padding-top: 24px; border-top: 1px solid #e6dccb; }
      button { margin-top: 24px; height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: #127c83; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>JEDDAH LIFE needs a connection to show places, opening hours and events, so we don't show outdated information.</p>
      <p>Reconnect and try again.</p>
      <div class="ar" lang="ar">
        <h1>أنت غير متصل</h1>
        <p>يحتاج جدة لايف إلى اتصال بالإنترنت لعرض الأماكن ومواعيد العمل والفعاليات، حتى لا نعرض معلومات قديمة.</p>
        <p>أعد الاتصال وحاول مجددًا.</p>
      </div>
      <button type="button" onclick="location.reload()">Try again · حاول مجددًا</button>
    </main>
  </body>
</html>
